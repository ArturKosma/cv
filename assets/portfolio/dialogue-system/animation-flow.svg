<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" role="img" aria-labelledby="title desc">
  <title id="title">How the dialogue animation layers combine</title>
  <desc id="desc">The numbers refer to the four sample videos. One: iPhone-recorded emotion loops have their mouth curves muted while speaking. Two: lip sync generated from voice audio has brow and eye curves filtered out. These two facial layers blend by taking the maximum value of each curve. Three: procedural head and eye tracking supplies attention to the dialogue partner. Four: the combined result powers every dialogue in Chernobylite 2.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6" fill="#c4a35a"/>
    </marker>
  </defs>
  <g fill="none" stroke="#c4a35a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M100 68v12h200"/>
    <path d="M300 68v24" marker-end="url(#arrow)"/>
    <path d="M300 156v12H200"/>
    <path d="M100 156v12h100v14" marker-end="url(#arrow)"/>
  </g>
  <g fill="#c4a35a">
    <circle cx="300" cy="80" r="2.5"/>
    <circle cx="200" cy="168" r="2.5"/>
  </g>
  <g fill="#151d18" stroke="#69756d" stroke-width="1">
    <rect x="8" y="4" width="184" height="64" rx="3"/>
    <rect x="208" y="4" width="184" height="64" rx="3"/>
    <rect x="8" y="92" width="184" height="64" rx="3"/>
    <rect x="208" y="92" width="184" height="64" rx="3" stroke="#c4a35a"/>
    <rect x="60" y="182" width="280" height="48" rx="3" stroke="#c4a35a"/>
  </g>
  <g fill="#e8ece9" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <text x="100" y="24">1 · Emotion loops</text>
    <text x="300" y="24">2 · Lip sync</text>
    <text x="100" y="112">3 · Head + eyes</text>
    <text x="300" y="112">Curve blend · MAX</text>
    <text x="200" y="202">4 · Every dialogue</text>
  </g>
  <g fill="#a9b3ac" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">
    <text x="100" y="44">iPhone capture</text>
    <text x="100" y="60">Mute mouth in speech</text>
    <text x="300" y="44">Voice audio</text>
    <text x="300" y="60">Filter brow + eye curves</text>
    <text x="100" y="132">Procedural tracking</text>
    <text x="100" y="148">Follow dialogue partner</text>
    <text x="300" y="132">Higher value</text>
    <text x="300" y="148">for each facial curve</text>
    <text x="200" y="222">Emotion + lip sync + attention</text>
  </g>
</svg>
