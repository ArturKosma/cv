<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1412" />
    <link rel="icon" href="assets/favicon.svg?v=328" type="image/svg+xml" />
    <meta name="description" content="CV — Artur Kosma." />
    <title>CV — Artur Kosma</title>
    <link rel="stylesheet" href="css/tokens.css?v=328" />
    <link rel="stylesheet" href="css/base.css?v=328" />
    <link rel="stylesheet" href="css/components.css?v=328" />
    <link rel="stylesheet" href="css/pages.css?v=328" />
  </head>
  <body class="page-resume">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <nav class="nav-actions" aria-label="Primary">
        <a class="btn" href="index.html">About</a>
        <a class="btn" href="samples.html">Samples</a>
        <a class="btn" href="reel.html">Reel</a>
        <span class="btn" aria-current="page">CV</span>
      </nav>
    </header>

    <main id="main" class="page resume-layout">
      <!--
        Letter-page preview = live resume HTML (select text, click site /
        LinkedIn) — not a PNG and not browser PDF chrome. Open / Download
        still use the real PDF (Brittany Chiang pattern).
      -->
      <div class="resume-column">
        <div class="resume-toolbar">
          <a
            class="resume-action"
            href="resume.pdf"
            target="_blank"
            rel="noopener noreferrer"
            >Open</a
          >
          <a
            class="resume-action resume-download"
            href="assets/resume/Artur-Kosma-Resume.pdf"
            download="Artur-Kosma-Resume.pdf"
            >Download</a
          >
        </div>

        <div class="resume-frame">
          <iframe
            class="resume-page resume-page--live"
            src="assets/resume/resume-source.html?v=329"
            title="Artur Kosma resume — selectable text; site and LinkedIn are links"
            loading="lazy"
            scrolling="no"
          ></iframe>
        </div>
      </div>
    </main>
    <script>
      /* Size the live resume iframe to its content so only the site scrolls. */
      (function () {
        const frame = document.querySelector(".resume-page--live");
        if (!frame) return;

        function fit() {
          try {
            const doc = frame.contentDocument;
            if (!doc || !doc.body) return;
            const h = Math.ceil(
              Math.max(
                doc.body.scrollHeight,
                doc.documentElement.scrollHeight,
                doc.body.offsetHeight,
                doc.documentElement.offsetHeight
              )
            );
            if (h > 0) frame.style.height = h + "px";
          } catch (_) {
            /* ignore cross-origin / unload */
          }
        }

        frame.addEventListener("load", fit);
        window.addEventListener("resize", fit);
        if (frame.contentDocument && frame.contentDocument.readyState === "complete") {
          fit();
        }
      })();
    </script>
  </body>
</html>
