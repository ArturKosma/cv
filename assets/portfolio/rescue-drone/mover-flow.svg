<svg xmlns="http://www.w3.org/2000/svg" width="400" height="104" viewBox="0 0 400 104" role="img" aria-labelledby="title desc">
  <title id="title">Replicated drone movement</title>
  <desc id="desc">Steering input feeds the Mover simulation, which drives replicated drone movement.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6" fill="#c4a35a"/>
    </marker>
  </defs>
  <g fill="#151d18" stroke="#69756d" stroke-width="1">
    <rect x="1" y="24" width="108" height="56" rx="3"/>
    <rect x="139" y="24" width="108" height="56" rx="3" stroke="#c4a35a"/>
    <rect x="277" y="24" width="122" height="56" rx="3"/>
  </g>
  <g fill="none" stroke="#c4a35a" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M112 52h23"/>
    <path d="M250 52h23"/>
  </g>
  <g fill="#e8ece9" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">
    <text x="55" y="48">Steering</text>
    <text x="55" y="67">input</text>
    <text x="193" y="48" fill="#c4a35a">Mover</text>
    <text x="193" y="67">simulation</text>
    <text x="338" y="48">Replicated</text>
    <text x="338" y="67">drone motion</text>
  </g>
</svg>
