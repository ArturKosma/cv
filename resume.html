        <div class="resume-toolbar">

            href="resume.pdf"

        <figure class="resume-frame">

            class="resume-page"
            src="assets/resume/Artur-Kosma-Resume.png?v=170"

            height="2112"
            alt="Artur Kosma — Principal Animation Engineer. Contact top-right. Experience growth at The Farm 51 from Junior Programmer to Principal Animation Engineer on Chernobylite and Rescue Drone Simulator. Skills, education, languages, location, interests."
