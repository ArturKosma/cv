<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title description">
  <title id="title">From accumulated shots to procedural shake and recovery</title>
  <desc id="description">Each damage event adds a hit location, direction and a 0.15-second lifetime to an array. On every animation update, the Animation Blueprint copies the array, clears it, subtracts frame time from each lifetime and adds back unexpired hits. This active array feeds the Control Rig. The rig combines additive rotations from the active hits with skeletal hierarchy falloff. Damped quaternion springs produce overlapping shakes and return the bones to their base pose after the hits expire.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7" fill="#c4a35a"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="#0f1412"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="20" y="28" fill="#c4a35a" font-size="20" font-weight="600">ANIMATION BLUEPRINT</text>
    <text x="20" y="54" fill="#a9b3ac" font-size="22">New shot → location, direction, lifetime 0.15 s</text>
    <text x="20" y="236" fill="#c4a35a" font-size="20" font-weight="600">CONTROL RIG</text>
  </g>
  <g fill="#151d18" stroke="#69756d" stroke-width="1.5">
    <rect x="20" y="72" width="270" height="112" rx="4"/>
    <rect x="350" y="72" width="270" height="112" rx="4"/>
    <rect x="20" y="254" width="270" height="112" rx="4"/>
    <rect x="350" y="254" width="270" height="112" rx="4" stroke="#c4a35a"/>
  </g>
  <g fill="none" stroke="#c4a35a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 127H342" marker-end="url(#arrow)"/>
    <path d="M485 184V204H155V245" marker-end="url(#arrow)"/>
    <path d="M290 310H342" marker-end="url(#arrow)"/>
  </g>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <g fill="#e8ece9" font-size="28" font-weight="600">
      <text x="155" y="104">Active hit array</text>
      <text x="485" y="104">Age &amp; filter</text>
      <text x="155" y="288">Combine rotations</text>
      <text x="485" y="288">Damped springs</text>
    </g>
    <g fill="#a9b3ac" font-size="22">
      <text x="155" y="134">Location · direction</text>
      <text x="485" y="160">Drop expired hits</text>
      <text x="155" y="319">From every active hit</text>
      <text x="155" y="346">Falloff along the hierarchy</text>
      <text x="485" y="319">Overlapping shakes</text>
      <text x="485" y="346">Return to the base pose</text>
    </g>
    <text x="485" y="135" fill="#e8ece9" font-family="Consolas, monospace" font-size="24">lifetime −= Δt</text>
  </g>
  <g fill="#c4a35a">
    <rect x="58" y="154" width="57" height="12" rx="2"/>
    <rect x="126" y="154" width="57" height="12" rx="2"/>
    <rect x="194" y="154" width="57" height="12" rx="2"/>
  </g>
</svg>
