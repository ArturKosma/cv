  <body class="page-contact">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">

    <main id="main" class="page contact-layout">
      <!-- Replace placeholder profile URL, LinkedIn, Facebook, and email -->
      <section class="contact-card" aria-label="Contact">
        <a
          class="contact-avatar-link"
          href="https://www.facebook.com/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook profile (placeholder)"
        >
          <img
            class="contact-avatar"
            src="assets/experience/portrait-placeholder.svg"
            width="96"
            height="96"
            alt=""
          />
        </a>

        <h1 class="contact-name">Artur Kosma</h1>
        <p class="contact-lede">Animation Engineer</p>

        <ul class="contact-list">
          <li>
            <a class="contact-row" href="mailto:artur.kosma@example.com">
              <span class="contact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <path d="M3 7l9 7 9-7" />
                </svg>
              </span>
              <span class="contact-label">Email</span>
              <span class="contact-value">artur.kosma@example.com</span>
            </a>
          </li>
          <li>
            <a
              class="contact-row"
              href="https://www.linkedin.com/in/arturkosma"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="contact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path
                    d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.5 8.5h4V23h-4V8.5zM8.5 8.5h3.8v2h.05c.53-1 1.82-2.05 3.75-2.05 4.01 0 4.75 2.64 4.75 6.07V23h-4v-5.9c0-1.41-.03-3.22-1.96-3.22-1.96 0-2.26 1.53-2.26 3.12V23h-4V8.5z"
                    transform="translate(1 0) scale(0.92)"
                  />
                </svg>
              </span>
              <span class="contact-label">LinkedIn</span>
              <span class="contact-value">linkedin.com/in/arturkosma</span>
            </a>
          </li>
          <li>
            <a
              class="contact-row"
              href="https://www.facebook.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="contact-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path
                    d="M14 8h3V4h-3c-2.8 0-5 2.2-5 5v2H6v4h3v9h4v-9h3.1l.9-4H13V9c0-.6.4-1 1-1z"
                  />
                </svg>
              </span>
              <span class="contact-label">Facebook</span>
              <span class="contact-value">facebook.com</span>
