    <main id="main" class="page contact-layout">
      <!--
        Brittany-style contact: identity, quiet email (click to copy),
        then icon-only LinkedIn / Facebook / GitHub.
      -->
      <section class="contact-card" aria-label="Contact">
        <div class="contact-identity">
          <img
            class="contact-avatar"
            src="assets/experience/portrait-placeholder.svg"
            width="96"
            height="96"
            alt="Portrait of Artur Kosma"
          />
          <div class="contact-copy">
            <h1 class="contact-name">Artur Kosma</h1>
            <p class="contact-lede">Senior Animation Engineer</p>
          </div>
        </div>

        <a
          class="contact-email contact-row--primary"
          href="mailto:leq.artur.kosma@gmail.com"
          aria-label="Copy email leq.artur.kosma@gmail.com"
        >
          <span class="contact-value">leq.artur.kosma@gmail.com</span>
        </a>

        <ul class="contact-social" aria-label="Profiles">
          <li>
            <a
              class="contact-social__link"
              href="https://www.linkedin.com/in/arturkosma"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"

              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">

          <li>
            <a
              class="contact-social__link"
              href="https://www.facebook.com/artur.kosma.7/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook"
            >
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">

                  d="M14.5 8.25h2.75V4.5H14.5c-2.9 0-5.25 2.35-5.25 5.25V12H6.5v3.75h2.75V23h3.75v-7.25H16l.75-3.75h-3.5v-1.75c0-.69.56-1.25 1.25-1.25z"
