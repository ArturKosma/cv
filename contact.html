  <body class="page-contact">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <nav class="nav-actions" aria-label="Primary">
        <a class="btn" href="index.html">Experience</a>
        <a class="btn" href="samples.html">Samples</a>

        <a class="btn" href="resume.html">Resume</a>
        <span class="btn" aria-current="page">Contact</span>
      </nav>
    </header>

    <main id="main" class="page contact-layout">
      <!--
        Brittany-style contact: identity, centered quiet email (click to copy;
        drag-select still works), then brand-mark socials centered under.
      -->
      <section class="contact-card" aria-label="Contact">
        <div class="contact-identity">
          <img
            class="contact-avatar"
            src="assets/experience/portrait-placeholder.svg"
            width="96"
            height="96"
            alt="Portrait of Artur Kosma"
          />
          <div class="contact-copy">
            <h1 class="contact-name">Artur Kosma</h1>
            <p class="contact-lede">Principal Animation Engineer</p>
          </div>
        </div>

        <a
          class="contact-email contact-row--primary"
          href="mailto:leq.artur.kosma@gmail.com"
          aria-label="Copy email leq.artur.kosma@gmail.com"
        >
          <svg
            class="contact-email__icon"
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="currentColor"
            aria-hidden="true"
          >
            <!-- Filled envelope mark — same solid currentColor treatment as socials -->
            <path
              d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"
            />
          </svg>
          <span class="contact-value">leq.artur.kosma@gmail.com</span>
        </a>

        <ul class="contact-social" aria-label="Profiles">
          <li>
            <a
              class="contact-social__link"
              href="https://www.linkedin.com/in/arturkosma"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <!-- Official LinkedIn mark (rounded square background), Brittany Chiang pattern -->
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                <path
                  d="M20.5 2h-17A1.5 1.5 0 002 3.5v17A1.5 1.5 0 003.5 22h17a1.5 1.5 0 001.5-1.5v-17A1.5 1.5 0 0020.5 2zM8 19H5v-9h3zM6.5 8.25A1.75 1.75 0 118.3 6.5a1.78 1.78 0 01-1.8 1.75zM19 19h-3v-4.74c0-1.42-.6-1.93-1.38-1.93A1.74 1.74 0 0013 14.19a.66.66 0 000 .14V19h-3v-9h2.9v1.3a3.11 3.11 0 012.7-1.4c1.55 0 3.36.86 3.36 3.66z"
                />
              </svg>
            </a>
          </li>
          <li>
            <a
              class="contact-social__link"
              href="https://www.facebook.com/artur.kosma.7/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook"
            >
              <!-- Official Facebook mark (circle background) -->
              <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                <path
                  d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"
                />
              </svg>
            </a>
          </li>
          <li>
            <a
              class="contact-social__link"
              href="https://github.com/ArturKosma/Learning"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
            >
              <!-- Filled GitHub mark (Brittany Chiang pattern) -->
              <svg viewBox="0 0 16 16" width="22" height="22" fill="currentColor" aria-hidden="true">
                <path
                  d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
                />
              </svg>
            </a>
          </li>
        </ul>
      </section>
    </main>

    <script src="js/copy-email.js?v=118" defer></script>
