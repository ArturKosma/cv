    <main id="main" class="page reel-layout">
      <!--
        Reel pattern: quiet year label, then facade spanning the full content
        shell like Samples; click-to-load YouTube keeps first paint light.
      -->
      <h1 class="reel-title">2026</h1>
      <div
        class="yt-facade"
        data-youtube-id="4VxTuWabQGQ"
        data-title="Artur Kosma reel 2026"
      >
        <button type="button" class="yt-facade__button" aria-label="Play reel">
          <img
            class="yt-facade__poster"
            src="assets/reel/poster.jpg?v=178"
            alt=""
            width="1280"
            height="720"
            loading="lazy"
            decoding="async"
          />
          <span class="yt-facade__play" aria-hidden="true"></span>
        </button>
      </div>
    </main>

    <script src="js/youtube-facade.js?v=178" defer></script>
