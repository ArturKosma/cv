<svg xmlns="http://www.w3.org/2000/svg" width="400" height="104" viewBox="0 0 400 104" role="img" aria-labelledby="title desc">
  <title id="title">Convert unarmed motion matching to additive motion</title>
  <desc id="desc">Unarmed locomotion enters the Additive input of Make Dynamic Additive. Neutral idle at time zero enters its Base input. The result is cached as MotionMatchingAsAdditive.</desc>
  <defs>
    <marker id="arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5" fill="#c4a35a"/></marker>
  </defs>
  <g fill="#151c18" stroke="#39453b" stroke-width="1">
    <rect x="1" y="1" width="117" height="43" rx="5"/>
    <rect x="1" y="60" width="117" height="43" rx="5"/>
    <rect x="145" y="15" width="138" height="74" rx="5"/>
    <rect x="310" y="24" width="89" height="56" rx="5"/>
  </g>
  <g fill="none" stroke="#c4a35a" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M118 22H128V58H143"/>
    <path d="M118 81H134V76H143"/>
    <path d="M283 52H308"/>
  </g>
  <g fill="#e8ece6" font-family="Arial, sans-serif" font-size="14">
    <text x="12" y="19">Unarmed</text><text x="12" y="36">locomotion</text>
    <text x="12" y="79">Neutral idle</text><text x="12" y="95" font-size="11" fill="#a3ada3">Time = 0</text>
    <text x="156" y="31" font-size="13">Make Dynamic</text>
    <text x="156" y="46" font-size="13">Additive</text>
    <text x="156" y="63" font-size="12" fill="#a3ada3">Additive</text>
    <text x="156" y="81" font-size="12" fill="#a3ada3">Base</text>
    <text x="320" y="47">Additive</text><text x="320" y="65">motion</text>
  </g>
</svg>
