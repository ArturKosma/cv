        <a class="btn" href="portfolio.html">Portfolio</a>

    <main id="main" class="page home-layout">
      <section class="experience" aria-labelledby="experience-heading">
        <h2 id="experience-heading" class="section-label">Experience</h2>
        <ol class="timeline">
          <li class="timeline-item">
            <time class="timeline-dates" datetime="2017/2019">2017–2019</time>

          <li class="timeline-item is-placeholder">
            <time class="timeline-dates">YYYY–YYYY</time>
            <div class="timeline-copy">
              <h3 class="timeline-role">Role placeholder</h3>
              <p class="timeline-org">Company placeholder</p>

            <div class="timeline-copy">
              <h3 class="timeline-role">Role placeholder</h3>
              <p class="timeline-org">Company placeholder</p>
            </div>
          </li>
        </ol>
      </section>

      <section class="identity" aria-labelledby="hero-name">
        <h1 id="hero-name" class="hero-brand">Artur Kosma</h1>
        <p class="lede">Animation Engineer with passion for games</p>
        <div class="portrait">
          <div
            class="portrait-frame"
            role="img"
            aria-label="Portrait photo placeholder"
          ></div>
          <p class="portrait-note">Photo placeholder</p>
        </div>
